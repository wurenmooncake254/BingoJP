name: Build Android APK

# 手动点「Run workflow」，或者 push 到 main 时自动跑
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      # ---------- 工具链 ----------
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Rust + Android 编译目标
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android

      # ---------- Android SDK / NDK ----------
      - name: 安装 Android SDK 组件
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "SDK = $SDK"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then SDKM="$(command -v sdkmanager)"; fi
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platform-tools" "platforms;android-36" \
            "build-tools;36.0.0" "build-tools;35.0.0" > /dev/null
          for v in 27.2.12479018 27.1.12297006 27.0.12077973; do
            if "$SDKM" --install "ndk;$v" > /dev/null 2>&1; then break; fi
          done
          NDK="$(ls -d "$SDK"/ndk/*/ 2>/dev/null | sort -V | tail -1)"
          NDK="${NDK%/}"
          echo "NDK = $NDK"
          { echo "ANDROID_NDK_HOME=$NDK"; echo "NDK_HOME=$NDK"; } >> "$GITHUB_ENV"

      # gradlew 在仓库里没有可执行位（作者是 Windows 提交的），Linux 上要补
      - name: 修 gradlew 执行权限
        run: chmod +x src-tauri/gen/android/gradlew

      - name: 安装前端依赖
        run: npm ci --no-audit --no-fund

      - name: 构建 debug APK
        run: npm run android:debug

      - name: 列出产物
        run: find src-tauri/gen/android/app/build/outputs -name '*.apk' -print

      - name: 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bingojp-debug-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      # 手动触发时顺手发个 Release，手机上可以直接点链接下载，不用解压 zip
      - name: 发布到 Release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -1)"
          echo "APK: $APK"
          gh release create "apk-${{ github.run_number }}" "$APK" \
            --title "BingoJP APK #${{ github.run_number }}" \
            --notes "自动构建的 debug APK。手机浏览器直接点这个 .apk 下载安装即可（需允许安装未知来源应用）。"
